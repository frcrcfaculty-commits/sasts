<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Departments | SASTS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="page-wrapper">
        <div id="sidebar-container"></div>

        <main class="main-content">
            <div class="page-header">
                <div>
                    <h1 class="page-title">Departments</h1>
                    <p class="page-subtitle">Manage college departments and create admin accounts</p>
                </div>
                <div class="flex gap-md">
                    <button class="btn btn-secondary" onclick="showAddDeptModal()">+ Add Department</button>
                    <button class="btn btn-primary" onclick="showAddAdminModal()">+ Add Admin</button>
                </div>
            </div>

            <div id="alert-container"></div>

            <!-- Stats Grid -->
            <div class="stats-grid" id="stats-grid">
                <!-- Stats will be loaded here -->
            </div>

            <!-- Departments Table -->
            <div class="card mb-lg">
                <div class="card-header">
                    <h3>All Departments</h3>
                </div>
                <div class="card-body">
                    <div class="table-container">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Department</th>
                                    <th>Faculty</th>
                                    <th>Students</th>
                                    <th>Weak</th>
                                    <th>Strong</th>
                                    <th>Created</th>
                                </tr>
                            </thead>
                            <tbody id="depts-body">
                                <tr>
                                    <td colspan="6" class="text-center text-muted">Loading...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Admins Table -->
            <div class="card">
                <div class="card-header">
                    <h3>Department Admins</h3>
                </div>
                <div class="card-body">
                    <div class="table-container">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Department</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="admins-body">
                                <tr>
                                    <td colspan="5" class="text-center text-muted">Loading...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add Department Modal -->
    <div class="modal-overlay" id="add-dept-modal">
        <div class="modal">
            <div class="modal-header">
                <h3>Add Department</h3>
                <button class="btn-icon" onclick="closeModal('add-dept-modal')">✕</button>
            </div>
            <form id="add-dept-form">
                <div class="modal-body">
                    <div class="form-group">
                        <label class="form-label">Department Name</label>
                        <input type="text" id="dept-name" class="form-input" placeholder="e.g., Computer Engineering"
                            required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary"
                        onclick="closeModal('add-dept-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Add Department</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Add Admin Modal -->
    <div class="modal-overlay" id="add-admin-modal">
        <div class="modal">
            <div class="modal-header">
                <h3>Add Department Admin</h3>
                <button class="btn-icon" onclick="closeModal('add-admin-modal')">✕</button>
            </div>
            <form id="add-admin-form">
                <div class="modal-body">
                    <div class="form-group">
                        <label class="form-label">Full Name</label>
                        <input type="text" id="admin-name" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" id="admin-email" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Department</label>
                        <select id="admin-dept" class="form-select" required>
                            <option value="">Select department</option>
                        </select>
                        <p class="form-hint">Maximum 2 admins per department</p>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" id="admin-password" class="form-input" required minlength="6">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary"
                        onclick="closeModal('add-admin-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Create Admin</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        if (!requireAuth()) window.location.href = 'index.html';
        document.getElementById('sidebar-container').innerHTML = buildSidebar();

        const user = getUser();
        if (user.role !== 'superadmin') {
            window.location.href = 'dashboard.html';
        }

        async function loadData() {
            try {
                // Load stats
                const statsRes = await authFetch('/superadmin/stats');
                const statsData = await statsRes.json();

                document.getElementById('stats-grid').innerHTML = `
          <div class="stat-card primary">
            <div class="stat-value">${statsData.summary.totalDepartments}</div>
            <div class="stat-label">Departments</div>
          </div>
          <div class="stat-card primary">
            <div class="stat-value">${statsData.summary.totalFaculty}</div>
            <div class="stat-label">Total Faculty</div>
          </div>
          <div class="stat-card weak">
            <div class="stat-value">${statsData.summary.totalWeak}</div>
            <div class="stat-label">Weak Students</div>
          </div>
          <div class="stat-card strong">
            <div class="stat-value">${statsData.summary.totalStrong}</div>
            <div class="stat-label">Strong Students</div>
          </div>
        `;

                // Departments table
                const deptRes = await authFetch('/superadmin/departments');
                const deptData = await deptRes.json();

                const deptBody = document.getElementById('depts-body');
                const adminDeptSelect = document.getElementById('admin-dept');
                adminDeptSelect.innerHTML = '<option value="">Select department</option>';

                if (deptData.departments && deptData.departments.length > 0) {
                    deptBody.innerHTML = deptData.departments.map(d => `
            <tr>
              <td><strong>${d.name}</strong></td>
              <td>${d.stats?.faculty_count || 0}</td>
              <td>${d.stats?.student_count || 0}</td>
              <td><span class="badge badge-weak">${d.stats?.weak_count || 0}</span></td>
              <td><span class="badge badge-strong">${d.stats?.strong_count || 0}</span></td>
              <td>${formatDate(d.created_at)}</td>
            </tr>
          `).join('');

                    deptData.departments.forEach(d => {
                        const opt = document.createElement('option');
                        opt.value = d.id;
                        opt.textContent = d.name;
                        adminDeptSelect.appendChild(opt);
                    });
                }

                // Admins table
                const adminRes = await authFetch('/superadmin/admins');
                const adminData = await adminRes.json();

                const adminBody = document.getElementById('admins-body');
                if (adminData.admins && adminData.admins.length > 0) {
                    adminBody.innerHTML = adminData.admins.map(a => `
            <tr>
              <td><strong>${a.name}</strong></td>
              <td>${a.email}</td>
              <td>${a.department_name || '-'}</td>
              <td>
                <span class="badge ${a.is_active ? 'badge-completed' : 'badge-pending'}">
                  ${a.is_active ? 'Active' : 'Inactive'}
                </span>
              </td>
              <td>
                <button class="btn btn-sm ${a.is_active ? 'btn-danger' : 'btn-success'}" onclick="toggleAdminStatus(${a.id}, ${!a.is_active})">
                  ${a.is_active ? 'Deactivate' : 'Activate'}
                </button>
              </td>
            </tr>
          `).join('');
                } else {
                    adminBody.innerHTML = `<tr><td colspan="5" class="text-center text-muted">No admins created yet</td></tr>`;
                }
            } catch (error) {
                console.error('Load error:', error);
                showAlert('Failed to load data', 'error');
            }
        }

        function showAddDeptModal() {
            document.getElementById('add-dept-form').reset();
            document.getElementById('add-dept-modal').classList.add('active');
        }

        function showAddAdminModal() {
            document.getElementById('add-admin-form').reset();
            document.getElementById('add-admin-modal').classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        document.getElementById('add-dept-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            try {
                const response = await authFetch('/superadmin/departments', {
                    method: 'POST',
                    body: JSON.stringify({ name: document.getElementById('dept-name').value })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.message);

                closeModal('add-dept-modal');
                await loadData();

                // Show prompt to create admin for new department
                showCreateAdminPrompt(data.department);
            } catch (error) {
                showAlert(error.message || 'Failed to add department', 'error');
            }
        });

        // Show prompt to create admin after department creation
        function showCreateAdminPrompt(department) {
            const createAdmin = confirm(
                `✅ Department "${department.name}" created successfully!\n\n` +
                `Would you like to create an Admin account for this department now?\n\n` +
                `(Recommended: Each department should have at least one admin)`
            );

            if (createAdmin) {
                // Pre-select the new department and open admin modal
                document.getElementById('add-admin-form').reset();
                document.getElementById('admin-dept').value = department.id;
                document.getElementById('add-admin-modal').classList.add('active');

                // Focus on name field
                setTimeout(() => {
                    document.getElementById('admin-name').focus();
                }, 100);
            } else {
                showAlert('Department created! You can add an admin later.', 'success');
            }
        }

        document.getElementById('add-admin-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            try {
                const response = await authFetch('/superadmin/admins', {
                    method: 'POST',
                    body: JSON.stringify({
                        name: document.getElementById('admin-name').value,
                        email: document.getElementById('admin-email').value,
                        departmentId: document.getElementById('admin-dept').value,
                        password: document.getElementById('admin-password').value
                    })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.message);

                showAlert('Admin created', 'success');
                closeModal('add-admin-modal');
                loadData();
            } catch (error) {
                showAlert(error.message || 'Failed to create admin', 'error');
            }
        });

        async function toggleAdminStatus(adminId, activate) {
            if (!confirm(`Are you sure you want to ${activate ? 'activate' : 'deactivate'} this admin?`)) return;

            try {
                const response = await authFetch(`/admin/users/${adminId}/status`, {
                    method: 'PUT',
                    body: JSON.stringify({ isActive: activate })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.message);

                showAlert(`Admin ${activate ? 'activated' : 'deactivated'}`, 'success');
                loadData();
            } catch (error) {
                showAlert(error.message || 'Failed to update status', 'error');
            }
        }

        loadData();
    </script>
</body>

</html>
